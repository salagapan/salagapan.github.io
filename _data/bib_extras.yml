# Site-only settings for publications synced from Zotero (bin/zotero_sync.py).
# Zotero holds the bibliographic data; this file holds what the website adds on top.
#
# venues:      badge text by journal / conference / preprint server name
#              (matching ignores case and braces). New papers in these venues
#              get the badge automatically.
# item_types:  fallback badge by Zotero item type when no venue badge applies.
# entries:     per-paper settings, keyed by the BibTeX key Zotero generates
#              (e.g. alagapan_cingulate_2023). Supported fields: abbr, selected,
#              html, pdf, code, arxiv, website, slides, poster, video, and
#              list (`other` or `main`) to override which list the item goes in.
#              Set `selected: true` to show a paper on the home page.
#
# The sync log lists any entry key below that no longer matches a Zotero item
# (this happens if you edit an item's title or year in Zotero).
venues:
  2023 11th International IEEE/EMBS Conference on Neural Engineering (NER): IEEE NER
  Advances in Neural Information Processing Systems: NeurIPS
  arXiv: arXiv
  Biological Psychiatry: Biol Psychiatry
  'Biological Psychiatry: Cognitive Neuroscience and Neuroimaging': Biol Psych CNNI
  bioRxiv: bioRxiv
  Cell Reports: Cell Rep
  Cerebral Cortex: Cereb Cortex
  Current Biology: Curr Biol
  European Journal of Neuroscience: EJN
  European Psychiatry: Eur Psychiatry
  Frontiers in Bioengineering and Biotechnology: Front Bioeng
  Frontiers in Human Neuroscience: Front Hum Neurosci
  Frontiers in neural circuits: Front Neural Circuits
  IEEE transactions on nanobioscience: IEEE TNB
  IEEE Transactions on Neural Systems and Rehabilitation Engineering: IEEE TNSRE
  Journal of music therapy: J Music Ther
  Journal of neural engineering: J Neural Eng
  medRxiv: medRxiv
  Nature: Nature
  NeuroImage: NeuroImage
  PLoS biology: PLoS Biol
  Scientific Reports: Sci Rep
  The Conversation: The Conversation
  'Transcranial Direct Current Stimulation in Neuropsychiatric Disorders: Clinical Principles and Management': Book Chapter
  Translational Psychiatry: Transl Psychiatry
